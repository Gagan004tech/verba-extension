<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>VERBA Voice Assistant</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 16px;
      margin: 0;
      background: #f9f9f9;
    }
    button {
      padding: 10px 16px;
      font-size: 14px;
      cursor: pointer;
      border-radius: 4px;
      border: 1px solid #ccc;
      background: #007bff;
      color: white;
      font-weight: bold;
    }
    button:hover {
      background: #0056b3;
    }
    #status {
      margin-top: 12px;
      color: #666;
      font-style: italic;
    }
    #transcript {
      margin-top: 16px;
      padding: 12px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 4px;
      min-height: 48px;
    }
    #intent-json {
      margin-top: 12px;
      padding: 12px;
      background: #1e1e1e;
      color: #9cdcfe;
      border-radius: 4px;
      font-family: "Courier New", monospace;
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-word;
      min-height: 24px;
    }
  </style>
</head>
<body>
  <h2>VERBA Assistant</h2>
  <button id="toggle-mic">Start Listening</button>
  <div id="status">Ready</div>
  <div id="transcript">Spoken commands will appear here...</div>
  <div id="intent-json">Parsed intent JSON will appear here...</div>

  <script type="module" src="index.js"></script>
</body>
</html>
